name: Bug report
description: Report a problem with Renamer.
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Renamer version, Cavalry version, and Windows or macOS version.
      placeholder: "Renamer 1.0.1 / Cavalry 2.7.2 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include example layer names, Match, Rename to, and starting number.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Screenshots and relevant JavaScript Console messages help.
    validations:
      required: true
